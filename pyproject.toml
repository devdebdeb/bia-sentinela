[project]
name = "bia-sentinela"
version = "0.2.0"
description = "Harness seguro e observável para agente financeiro com IA Generativa"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "pandas>=2.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
llm = ["anthropic>=0.39"]
openai = ["openai>=1.40"]
data = ["matplotlib>=3.7"]
ml = ["scikit-learn>=1.3"]
ui = ["streamlit>=1.30"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[tool.setuptools.packages.find]
# Layout misto: o pacote principal vive em src/, e `config` na raiz (importado
# como `config.settings`). Inclui ambos no editable install.
where = ["src", "."]
include = ["bia_sentinela*", "config*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
ignore = ["ANN101", "ANN102", "ANN401"]
